---
services:
  server_survival:
    image: ghcr.io/minetest/minetest:5.9.0
    user: root
    restart: unless-stopped
    networks:
      - default
    volumes:
      - ./maps/survival:/root/.minetest/worlds/world
      - ./mods:/root/.minetest/worlds/world/worldmods:ro
      - ./games:/root/.minetest/games:ro
      - ./config/survival.conf:/etc/minetest/minetest.conf:ro
      # - ./config/mapserver.json:/root/.minetest/worlds/world/mapserver.json:ro
    ports:
      - "30001:30001/udp"
      - "30001:30001/tcp"
  server_pvp:
    image: ghcr.io/minetest/minetest:5.9.0
    user: root
    restart: unless-stopped
    networks:
      - default
    volumes:
      - ./maps/pvp:/root/.minetest/worlds/world
      - ./mods:/root/.minetest/worlds/world/worldmods:ro
      - ./games:/root/.minetest/games:ro
      - ./config/pvp.conf:/etc/minetest/minetest.conf:ro
    ports:
      - "30002:30002/udp"
      - "30002:30002/tcp"
  mapserver_survival:
    image: minetestmapserver/mapserver:4.8.0
    restart: unless-stopped
    networks:
      - default
    depends_on:
      - "server_survival"
    volumes:
      - "./maps/survival:/minetest"
    working_dir: "/minetest"
    expose:
      - "8080:8080"
    ports:
      - "8080:8080"
    logging:
      options:
        max-size: 50m
